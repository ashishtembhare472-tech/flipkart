<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Shilpa</title>
  <style>
    body {
      background-color: #ffe6e6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    .heart {
      color: #ff3366;
      font-size: 60px;
      animation: bounce 1.2s infinite;
    }
    h1 {
      color: #333;
      margin-top: 20px;
      font-size: 28px;
    }
    p {
      color: #666;
      font-size: 16px;
    }
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">&hearts;</div>
    <h1>I Love You, Shilpa!</h1>
    <p>You are my heart and my soul.</p>
  </div>
</body>
</html>
